### application settings
spring.application.name=speech-bot

### bot settings
bot.token=mock-token
bot.username=mock-username
bot.expiration-seconds=60

### speech kit setting
speech-kit.api-key=mock-api-key

### grpc settings
grpc.client.speech-kit-grpc.address=stt.api.cloud.yandex.net:443
grpc.client.speech-kit-grpc.negotiation-type=tls
grpc.client.speech-kit-grpc.enable-keep-alive=true
